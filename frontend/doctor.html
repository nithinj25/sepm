<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OHAMS – Doctor dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>OHAMS · Doctor</h1>
    <div><span id="who"></span> &nbsp; <button onclick="Auth.logout()">Log out</button></div>
  </header>
  <main>
    <div class="row tabs">
      <button data-tab="today" class="active">Today</button>
      <button data-tab="week">This week</button>
      <button data-tab="availability">Availability</button>
    </div>

    <section id="today" class="card">
      <h2>Today's appointments</h2>
      <table>
        <thead><tr><th>Time</th><th>Patient</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="todayRows"></tbody>
      </table>
    </section>

    <section id="week" class="card hidden">
      <h2>Next 7 days</h2>
      <table>
        <thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>Reason</th><th>Status</th></tr></thead>
        <tbody id="weekRows"></tbody>
      </table>
    </section>

    <section id="availability" class="card hidden">
      <h2>Weekly working hours</h2>
      <table>
        <thead><tr><th>Day</th><th>Start</th><th>End</th><th>Active</th></tr></thead>
        <tbody id="availRows"></tbody>
      </table>
      <h3>Leave days</h3>
      <div class="row">
        <input type="date" id="leaveDate">
        <button onclick="addLeave()">Add</button>
      </div>
      <ul id="leaveList"></ul>
      <p><button class="primary" onclick="saveAvailability()">Save</button> <span id="saved"></span></p>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/doctor.js"></script>
</body>
</html>
