<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OHAMS – Admin dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>OHAMS · Admin</h1>
    <button onclick="Auth.logout()">Log out</button>
  </header>
  <main>
    <div class="stats">
      <div class="card stat">Today<b id="sToday">0</b></div>
      <div class="card stat">Next 7 days<b id="sWeek">0</b></div>
      <div class="card stat">Cancellation rate<b id="sCancel">0%</b></div>
    </div>

    <section class="card">
      <h2>Appointments</h2>
      <div class="row">
        <input type="date" id="fDate">
        <select id="fDoctor"><option value="">All doctors</option></select>
        <select id="fStatus">
          <option value="">All statuses</option>
          <option value="booked">Booked</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
          <option value="no_show">No-show</option>
        </select>
        <button onclick="clearFilters()">Clear</button>
      </div>
      <table>
        <thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>Doctor</th><th>Department</th><th>Status</th></tr></thead>
        <tbody id="apptRows"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Doctors</h2>
      <div class="row">
        <input id="nName" placeholder="Name">
        <input id="nEmail" placeholder="Email">
        <select id="nDept"></select>
        <button class="primary" onclick="addDoctor()">Add doctor</button>
      </div>
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Status</th><th></th></tr></thead>
        <tbody id="docRows"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Departments</h2>
      <div class="row">
        <input id="nDeptName" placeholder="Department name">
        <button class="primary" onclick="addDepartment()">Add department</button>
      </div>
      <ul id="deptList"></ul>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
